<style>
:root{
  --ink:#0F0F0E;--surface:#1B1A14;--cream:#F4F0E6;--gold:#C99A3F;--gold-bright:#E2B85C;
  --teal:#3FB594;--muted:#8C887C;--line:rgba(244,240,230,0.12);
  --font-display:"Poppins",sans-serif;--font-body:"Be Vietnam Pro",sans-serif;--font-mono:"JetBrains Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--cream);font-family:var(--font-body);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.12;letter-spacing:-0.02em}
a{color:var(--gold);text-decoration:none}
.wrap{max-width:920px;margin:0 auto;padding:0 32px}

/* gate */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px}
.lock{width:100%;max-width:420px;text-align:center}
.lock .mark{width:54px;height:54px;fill:var(--cream);margin:0 auto 22px;display:block}
.lock .eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.lock h1{font-size:30px;margin-bottom:12px}
.lock p{color:var(--muted);font-size:15px;margin-bottom:26px}
.field{display:flex;gap:10px}
.field input{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--cream);font-family:var(--font-mono);font-size:14px;padding:14px 16px;border-radius:6px;outline:none}
.field input:focus{border-color:var(--gold)}
.field button{font-family:var(--font-mono);font-size:13px;letter-spacing:0.04em;padding:0 22px;background:var(--gold);color:var(--ink);border:none;border-radius:6px;cursor:pointer;transition:background .2s}
.field button:hover{background:var(--gold-bright)}
.err{color:#E2706A;font-size:13px;font-family:var(--font-mono);margin-top:14px;min-height:18px;letter-spacing:0.02em}
.enc-note{margin-top:26px;font-family:var(--font-mono);font-size:11px;color:var(--muted);letter-spacing:0.04em;line-height:1.7}
.enc-note .lk{color:var(--gold)}
.back{display:block;margin-top:30px;font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.back:hover{color:var(--cream)}

/* content shell */
#bp-content{display:none;padding:70px 0 120px}
.bp-confidential{font-family:var(--font-mono);font-size:11px;letter-spacing:0.06em;color:var(--gold);border:1px solid var(--gold);border-radius:6px;padding:12px 16px;margin-bottom:50px;background:rgba(201,154,63,0.05)}
.bp-cover{margin-bottom:70px;border-bottom:1px solid var(--line);padding-bottom:50px}
.bp-eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:var(--gold);margin-bottom:22px}
.bp-h1{font-size:clamp(30px,4.4vw,48px);font-weight:700;letter-spacing:-0.03em;margin-bottom:24px}
.bp-lede{font-size:19px;color:#CFC9B8;max-width:680px}
.bp-sec{margin-bottom:54px}
.bp-h2{font-size:26px;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.bp-sec p{color:#CFC9B8;margin-bottom:16px;max-width:740px}
.bp-list{list-style:none;margin:0 0 16px;max-width:740px}
.bp-list li{position:relative;padding-left:22px;margin-bottom:12px;color:#CFC9B8}
.bp-list li::before{content:"";position:absolute;left:0;top:11px;width:7px;height:7px;background:var(--gold);border-radius:1px}
.bp-list b{color:var(--cream);font-weight:500}
.bp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:8px 0 24px}
.bp-stat{background:var(--ink);padding:22px 20px}
.bp-statnum{font-family:var(--font-display);font-weight:600;font-size:26px;color:var(--gold);letter-spacing:-0.02em}
.bp-statlbl{font-family:var(--font-mono);font-size:11px;letter-spacing:0.05em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.bp-chartbox{border:1px solid var(--line);border-radius:10px;padding:26px;margin:24px 0;background:rgba(244,240,230,0.02)}
.bp-ctitle{font-family:var(--font-mono);font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:var(--gold);margin-bottom:18px}
.bp-canvaswrap{position:relative;width:100%;height:340px}
.bp-canvaswrap.bp-short{height:230px}
.bp-cnote{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-top:16px;letter-spacing:0.03em;line-height:1.6}
.bp-table{width:100%;border-collapse:collapse;margin:8px 0 16px;max-width:740px}
.bp-table td{border-bottom:1px solid var(--line);padding:13px 4px;font-size:15px;color:#CFC9B8;vertical-align:top}
.bp-table td:first-child{color:var(--cream)}
.bp-table td:last-child{text-align:right;font-family:var(--font-mono);font-size:13px;color:var(--gold);white-space:nowrap;padding-left:20px}
.bp-close{border-top:1px solid var(--line);padding-top:46px}
@media(max-width:680px){.bp-stats{grid-template-columns:repeat(2,1fr)}.field{flex-direction:column}}
</style>
</head>

  function b2b(b64){ var bin=atob(b64), a=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i); return a; }
  async function unlock(pw){
    var enc=new TextEncoder();
    var base=await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2', salt:b2b(ENC.salt), iterations:ENC.iters, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM', iv:b2b(ENC.iv)}, key, b2b(ENC.ct));
    return new TextDecoder().decode(pt);
  }
  var gate=document.getElementById('gate'), content=document.getElementById('bp-content');
  var pw=document.getElementById('pw'), go=document.getElementById('go'), err=document.getElementById('err');

  async function attempt(){
    err.textContent=''; go.textContent='Decrypting';
    try{
      var html=await unlock(pw.value);
      content.innerHTML=html;
      gate.style.display='none';
      content.style.display='block';
      window.scrollTo(0,0);
      initCharts();
    }catch(e){
      go.textContent='Unlock';
      err.textContent='Incorrect password. Access denied.';
      pw.value=''; pw.focus();
    }
  }
  go.addEventListener('click', attempt);
  pw.addEventListener('keydown', function(e){ if(e.key==='Enter') attempt(); });
  pw.focus();

  function initCharts(){
    var txt='#CFC9B8', grid='rgba(244,240,230,0.10)', gold='#C99A3F', teal='#3FB594';
    var mono='"JetBrains Mono", monospace';
    var data=JSON.parse(document.getElementById('biz-data').textContent);

    new Chart(document.getElementById('bpRevenue'),{
      type:'bar',
      data:{ labels:data.revenue.years, datasets:[
        {label:'Services', data:data.revenue.services, backgroundColor:gold, stack:'s'},
        {label:'Platform', data:data.revenue.platform, backgroundColor:teal, stack:'s'}
      ]},
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ labels:{ color:txt, font:{family:mono, size:12}, boxWidth:12 } },
          tooltip:{ callbacks:{ label:function(c){ return c.dataset.label+': $'+c.parsed.y.toFixed(1)+'M'; } } } },
        scales:{
          x:{ stacked:true, grid:{display:false}, ticks:{ color:txt, font:{family:mono, size:11} } },
          y:{ stacked:true, grid:{color:grid}, ticks:{ color:txt, font:{family:mono, size:11}, callback:function(v){ return '$'+v+'M'; } } }
        }
      }
    });

    var mvals=data.market.values, mlbl=data.market.labels;
    function fmtM(v){ return v>=1000 ? '$'+(v/1000).toFixed(1)+'B' : '$'+v+'M'; }
    var mktLabels={ id:'mkl', afterDatasetsDraw:function(ch){ var ctx=ch.ctx, m=ch.getDatasetMeta(0); ctx.save(); ctx.font='500 13px '+mono; ctx.fillStyle=txt; ctx.textBaseline='middle'; ctx.textAlign='left'; m.data.forEach(function(b,i){ ctx.fillText(fmtM(mvals[i]), b.x+8, b.y); }); ctx.restore(); } };
    new Chart(document.getElementById('bpMarket'),{
      type:'bar',
      data:{ labels:mlbl, datasets:[{ data:mvals, backgroundColor:[gold,'#B0842F','#8A6726'], borderSkipped:false, barThickness:30 }] },
      options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, layout:{padding:{right:80}},
        plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:function(c){ return fmtM(c.parsed.x); } } } },
        scales:{
          x:{ type:'logarithmic', min:10, max:30000, grid:{color:grid}, ticks:{ color:txt, font:{family:mono, size:11}, callback:function(v){ if(v===100)return '$100M'; if(v===1000)return '$1B'; if(v===10000)return '$10B'; return null; } } },
          y:{ grid:{display:false}, ticks:{ color:txt, font:{family:mono, size:12} } }
        }
      },
      plugins:[mktLabels]
    });

    new Chart(document.getElementById('bpMargin'),{
      type:'bar',
      data:{ labels:data.margin.labels, datasets:[{ data:data.margin.values, backgroundColor:[gold,teal], borderSkipped:false, barThickness:64 }] },
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:function(c){ return c.parsed.y+'% gross margin'; } } } },
        scales:{
          x:{ grid:{display:false}, ticks:{ color:txt, font:{family:mono, size:12} } },
          y:{ min:0, max:100, grid:{color:grid}, ticks:{ color:txt, font:{family:mono, size:11}, callback:function(v){ return v+'%'; } } }
        }
      }
    });
  }
})();
